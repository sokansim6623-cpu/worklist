<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>검사 Worklist</title>

<style>
body { font-size:19px; text-align:center; font-family:Arial,sans-serif; }
input, button, select { font-size:18px; padding:5px 8px; margin:2px; }

th, td { padding:7px 8px; text-align:center; line-height:1.25; }
th { background:#f0f0f0; }
.muted { color:#666; }
.box { display:inline-block; padding:12px 14px; border:1px solid #ddd; border-radius:10px; }
.row { margin:8px 0; display:flex; align-items:center; justify-content:space-between; }
.left { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.right { display:flex; align-items:center; margin-left:40px; gap:8px; }
.short { width:140px; }
.phone { width:160px; }
.search { width:240px; }

.examWrap { margin-top:10px; }
.examGrid { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
.examGroup { border:1px solid #ddd; border-radius:10px; padding:8px; background:#fff; }
.examTitle { font-weight:700; background:#f3f3f3; padding:10px; border-radius:6px; cursor:pointer; }
.examItems { display:grid; grid-template-columns:repeat(2,1fr); gap:8px 12px; margin-top:10px; font-size:15px; }
label.chk { display:flex; align-items:center; gap:8px; }

@media(max-width:900px){
  .examGrid{grid-template-columns:repeat(2,1fr);}
  .examItems{grid-template-columns:repeat(2,1fr);}
}

.tableWrap{
  width:100%;
  display:flex;
  justify-content:center;
  margin:12px auto;
  overflow-x:auto;
}

table{
  border-collapse:collapse;
  table-layout:fixed;
  font-size:18px;
  width:1460px;
  min-width:1460px;
}

#summaryBox{ flex:1; }

#worklistTable th,
#worklistTable td{
  white-space:nowrap;
  word-break:keep-all;
}

#worklistTable th:nth-child(1), #worklistTable td:nth-child(1){ width:110px; } /* 차트번호 */
#worklistTable th:nth-child(2), #worklistTable td:nth-child(2){ width:110px; } /* 이름 */
#worklistTable th:nth-child(3), #worklistTable td:nth-child(3){ width:150px; } /* 핸드폰번호 */
#worklistTable th:nth-child(4), #worklistTable td:nth-child(4){ width:170px; } /* 검사항목 */
#worklistTable th:nth-child(5), #worklistTable td:nth-child(5){ width:90px; }  /* 상태 */
#worklistTable th:nth-child(6), #worklistTable td:nth-child(6){ width:90px; }  /* 접수 */
#worklistTable th:nth-child(7), #worklistTable td:nth-child(7){ width:90px; }  /* Start */
#worklistTable th:nth-child(8), #worklistTable td:nth-child(8){ width:90px; }  /* Finish */
#worklistTable th:nth-child(9), #worklistTable td:nth-child(9){ width:220px; } /* 검사결과 */
#worklistTable th:nth-child(10),#worklistTable td:nth-child(10){ width:140px; } /* 추적검사시기 */
#worklistTable th:nth-child(11),#worklistTable td:nth-child(11){ width:90px; } /* 관리 */

#worklistTable input[data-role="result"],
#worklistTable input[data-role="followUp"],
#worklistTable input[data-role="name"],
#worklistTable input[data-role="chart"],
#worklistTable input[data-role="phone"]{
  width:100%;
  height:32px;
  font-size:17px;
  padding:4px 8px;
  border:1px solid #999;
  border-radius:8px;
  margin:0;
  box-sizing:border-box;
}

#worklistTable td button{
  font-size:17px;
  padding:5px 8px;
  margin:0;
}

#worklistTable td:nth-child(11) button{
  font-size:14px;
  padding:4px 6px;
  margin:0 1px;
}

.categoryBox{
  display:flex;
  align-items:center;
  gap:14px;
  margin:10px 0 0;
  justify-content:center;
  flex-wrap:wrap;
}
.categoryBox .label{ font-weight:700; }
.categoryBox label{ display:flex; align-items:center; gap:8px; font-size:16px; }

.summaryWrap{
  max-width:1500px;
  margin:12px auto 0;
  padding:0 10px;
}
.tabBar{
  display:flex;
  gap:0;
  align-items:flex-end;
  justify-content:flex-start;
  border-bottom:3px solid #111;
}
.tabBtn{
  appearance:none;
  border:3px solid #111;
  border-bottom:none;
  background:#fff;
  padding:10px 16px 8px;
  font-size:19px;
  font-weight:500;
  border-top-left-radius:12px;
  border-top-right-radius:12px;
  margin:0 8px 0 0;
  cursor:pointer;
  line-height:1.05;
  min-width:130px;
  text-align:left;
}
.tabBtn .sub{
  display:block;
  font-size:16px;
  font-weight:500;
  color:#555;
  margin-top:6px;
}
.tabBtn.active{
  background:#f4f4f4;
  position:relative;
  top:3px;
}
@media (max-width:900px){
  .tabBar{ flex-wrap:wrap; }
  .tabBtn{ min-width:120px; }
}

.listHeader{
  width:1460px;
  margin:12px auto 0;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}
.summaryWrap{ flex:1; margin:0; padding:0; }
.excelWrap{ margin-left:20px; }

#statusFilterTh{
  width:100%;
  height:32px;
  font-size:16px;
  padding:4px 8px;
  border:1px solid #999;
  border-radius:8px;
  box-sizing:border-box;
  background:#fff;
}
</style>
</head>

<body>
<h2>속안심 Worklist</h2>

<div class="box">
  <div class="row">
    <div class="left">
      검사날짜:
      <input id="examDate" type="date">

      차트번호:
      <input id="chart" class="short">

      이름:
      <input id="name" class="short">

      <button id="btnAdd">등록</button>
    </div>

    <div class="right">
      찾기:
      <input id="q" class="search" placeholder="이름/차트/검사">
      <button id="btnSearch">검색</button>
      <button id="btnReset">초기화</button>
    </div>
  </div>

  <div class="categoryBox">
    <span class="label">분류(선택):</span>
    <label><input type="radio" name="category" value="영상"> 영상</label>
    <label><input type="radio" name="category" value="심장초음파"> 심장초음파</label>
    <label><input type="radio" name="category" value="초음파"> 초음파</label>
    <label><input type="radio" name="category" value="검진"> 검진</label>
  </div>

  <div class="examWrap">
    <div class="examGrid">

      <div class="examGroup">
        <div class="examTitle toggle">CT</div>
        <div class="examItems">
          <label class="chk"><input class="examChk" type="checkbox" value="C-CT">C-CT</label>
          <label class="chk"><input class="examChk" type="checkbox" value="A-CT">A-CT</label>
          <label class="chk"><input class="examChk" type="checkbox" value="B-CT">B-CT</label>
          <label class="chk"><input class="examChk" type="checkbox" value="Cardiac CT">Cardiac CT</label>
          <label class="chk"><input class="examChk" type="checkbox" value="CECA CT">CECA CT</label>
          <label class="chk"><input class="examChk" type="checkbox" value="dynamic CT">dynamic CT</label>
          <label class="chk"><input class="examChk" type="checkbox" value="기타 CT">기타 CT</label>
        </div>
      </div>

      <div class="examGroup">
        <div class="examTitle toggle">MRI</div>
        <div class="examItems">
          <label class="chk"><input class="examChk" type="checkbox" value="B-MRI">B-MRI</label>
          <label class="chk"><input class="examChk" type="checkbox" value="B-MRA">B-MRA</label>
          <label class="chk"><input class="examChk" type="checkbox" value="B-MRI&MRA">B-MRI&MRA</label>
          <label class="chk"><input class="examChk" type="checkbox" value="복부MRI">복부MRI</label>
          <label class="chk"><input class="examChk" type="checkbox" value="관절MRI">관절MRI</label>
          <label class="chk"><input class="examChk" type="checkbox" value="SPINE MRI">SPINE MRI</label>
        </div>
      </div>

      <div class="examGroup">
        <div class="examTitle toggle">초음파</div>
        <div class="examItems">
          <label class="chk"><input class="examChk" type="checkbox" value="HU">HU</label>
          <label class="chk"><input class="examChk" type="checkbox" value="TU">TU</label>
          <label class="chk"><input class="examChk" type="checkbox" value="IU(초음파)">IU(초음파)</label>
          <label class="chk"><input class="examChk" type="checkbox" value="IU(심초음파)">IU(심초음파)</label>
          <label class="chk"><input class="examChk" type="checkbox" value="TTE">TTE</label>
          <label class="chk"><input class="examChk" type="checkbox" value="BU">BU</label>
          <label class="chk"><input class="examChk" type="checkbox" value="기타">기타</label>
        </div>
      </div>

      <div class="examGroup">
        <div class="examTitle toggle">검진</div>
        <div class="examItems">
          <label class="chk"><input class="examChk" type="checkbox" value="건강검진">건강검진</label>
          <label class="chk"><input class="examChk" type="checkbox" value="위내시경">위내시경</label>
          <label class="chk"><input class="examChk" type="checkbox" value="대장내시경">대장내시경</label>
          <label class="chk"><input class="examChk" type="checkbox" value="기타">기타</label>
        </div>
      </div>

    </div>
  </div>
</div>

<hr>

<div class="listHeader">
  <div id="summaryBox" class="summaryWrap"></div>
  <div class="excelWrap">
    <button id="btnExportXlsx">엑셀로 저장</button>
  </div>
</div>

<div class="tableWrap">
  <table id="worklistTable" border="1">
    <thead>
      <tr>
        <th>차트번호</th>
        <th>이름</th>
        <th>핸드폰번호</th>
        <th>검사항목</th>
        <th>
          <select id="statusFilterTh" title="상태 필터">
            <option value="">상태(전체)</option>
            <option value="__BLANK__">공백</option>
            <option value="대기">대기</option>
            <option value="진행중">진행중</option>
            <option value="완료">완료</option>
          </select>
        </th>
        <th>접수</th>
        <th>Start</th>
        <th>Finish</th>
        <th>검사결과</th>
        <th>추적검사시기</th>
        <th>관리</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module" src="./script.js"></script>
</body>
</html>
