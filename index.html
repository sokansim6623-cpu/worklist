<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>검사 Worklist</title>

<style>
/* =========================
   전체 UI: 중간 사이즈(너무 크지도/작지도 않게)
========================= */
body { font-size:19px; text-align:center; font-family:Arial,sans-serif; }
input, button, select { font-size:18px; padding:5px 8px; margin:2px; }

th, td { padding:7px 8px; text-align:center; line-height:1.25; }
th { background:#f0f0f0; }
.muted { color:#666; }
.box { display:inline-block; padding:12px 14px; border:1px solid #ddd; border-radius:10px; }
.row { margin:8px 0; display:flex; align-items:center; justify-content:space-between; }
.left { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.right { display:flex; align-items:center; margin-left:40px; gap:8px; }
.short { width:140px; }
.search { width:240px; }

/* 검사 선택 영역 */
.examWrap { margin-top:10px; }
.examGrid { display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
.examGroup { border:1px solid #ddd; border-radius:10px; padding:8px; background:#fff; }
.examTitle { font-weight:700; background:#f3f3f3; padding:10px; border-radius:6px; cursor:pointer; }
.examItems { display:grid; grid-template-columns:repeat(2,1fr); gap:8px 12px; margin-top:10px; font-size:15px; }
label.chk { display:flex; align-items:center; gap:8px; }

@media(max-width:900px){
  .examGrid{grid-template-columns:repeat(2,1fr);}
  .examItems{grid-template-columns:repeat(2,1fr);}
}

/* =========================
   표 래퍼: 여백 + 스크롤
========================= */
.tableWrap{
  width:100%;
  display:flex;
  justify-content:center;
  margin:12px auto;
  overflow-x:auto;
}

/* =========================
   표: 폭/폰트/레이아웃 고정(줄바꿈 방지)
========================= */
table{
  border-collapse:collapse;
  table-layout:fixed;
  font-size:18px;
  width:1580px;
  min-width:1580px;
}

/* 탭 + 엑셀 한줄 정렬 */
.listTopBar{
  max-width:1580px;
  margin:12px auto 8px;
  padding:0 10px;
  display:flex;
  align-items:flex-start;
margin-top:4px;
  justify-content:space-between;
}

#summaryBox{
  flex:1;
}

#btnExportXlsx{
  margin-left:20px;
}

#worklistTable th,
#worklistTable td{
  white-space:nowrap;
  word-break:keep-all;
}

/* 컬럼 폭 고정 */
#worklistTable th:nth-child(1), #worklistTable td:nth-child(1){ width:120px; } /* 검사날짜 */
#worklistTable th:nth-child(2), #worklistTable td:nth-child(2){ width:100px; } /* 이름 */
#worklistTable th:nth-child(3), #worklistTable td:nth-child(3){ width:100px; } /* 차트번호 */
#worklistTable th:nth-child(4), #worklistTable td:nth-child(4){ width:130px; overflow:hidden; text-overflow:ellipsis; } /* 검사항목(조금 줄임) */
#worklistTable th:nth-child(5), #worklistTable td:nth-child(5){ width:95px; padding-left:6px; padding-right:6px; } /* 분류 */
#worklistTable th:nth-child(6), #worklistTable td:nth-child(6){ width:80px; }  /* 상태 */
#worklistTable th:nth-child(7), #worklistTable td:nth-child(7){ width:90px; }  /* 접수 */
#worklistTable th:nth-child(8), #worklistTable td:nth-child(8){ width:90px; }  /* Start */
#worklistTable th:nth-child(9), #worklistTable td:nth-child(9){ width:90px; }  /* Finish */
#worklistTable th:nth-child(10),#worklistTable td:nth-child(10){ width:190px; }/* 검사결과 */
#worklistTable th:nth-child(11),#worklistTable td:nth-child(11){ width:100px; }/* 추적검사시기 */
#worklistTable th:nth-child(12),#worklistTable td:nth-child(12){ width:120px; padding-left:6px; padding-right:6px; } /* 관리 */

/* 분류 select / 입력칸 / 버튼 */
#worklistTable select[data-role="category"]{
  width:82px;
  height:32px;
  font-size:14px;
  padding:4px 8px;
  border:1px solid #999;
  border-radius:8px;
  margin:0;
  box-sizing:border-box;
}

#worklistTable input[data-role="result"],
#worklistTable input[data-role="followUp"],
#worklistTable input[data-role="name"],
#worklistTable input[data-role="chart"]{
  width:100%;
  height:32px;
  font-size:17px;
  padding:4px 8px;
  border:1px solid #999;
  border-radius:8px;
  margin:0;
  box-sizing:border-box;
}

/* 버튼 */
#worklistTable td button{
  font-size:17px;
  padding:5px 8px;
  margin:0;
}

/* 관리 버튼 한 줄 고정 */
#worklistTable th:nth-child(12),
#worklistTable td:nth-child(12){
  white-space:nowrap;
}
#worklistTable td:nth-child(12) button{
  font-size:14px;
  padding:5px 8px;
  margin:0 2px;
}

/* 분류 라디오(등록시에만) */
.categoryBox{
  display:flex;
  align-items:center;
  gap:14px;
  margin:10px 0 0;
  justify-content:center;
  flex-wrap:wrap;
}
.categoryBox .label{ font-weight:700; }
.categoryBox label{ display:flex; align-items:center; gap:8px; font-size:16px; }

/* 탭형 요약 */
.summaryWrap{
  max-width:1580px;
  margin:12px auto 0;
  padding:0 10px;
}
.tabBar{
  display:flex;
  gap:0;
  align-items:flex-end;
  justify-content:flex-start;
  border-bottom:3px solid #111;
}
.tabBtn{
  appearance:none;
  border:3px solid #111;
  border-bottom:none;
  background:#fff;
  padding:10px 16px 8px;
  font-size:19px;
  font-weight:500;
  border-top-left-radius:12px;
  border-top-right-radius:12px;
  margin:0 8px 0 0;
  cursor:pointer;
  line-height:1.05;
  min-width:130px;
  text-align:left;
}
.tabBtn .sub{
  display:block;
  font-size:16px;
  font-weight:500;
  color:#555;
  margin-top:6px;
}
.tabBtn.active{
  background:#f4f4f4;
  position:relative;
  top:3px;
}
@media (max-width:900px){
  .tabBar{ flex-wrap:wrap; }
  .tabBtn{ min-width:120px; }
}

/* Worklist 상단 헤더 */
.listHeader{
  width:1580px;              /* 테이블과 동일 */
  margin:12px auto 0;
  position:relative;
}

/* 탭 줄 길이 테이블과 동일 */
.summaryWrap{
  width:100%;
  margin:0;
  padding:0;
}

/* 탭 아래 검은 줄 길이 정확히 맞춤 */
.tabBar{
  border-bottom:3px solid #111;
}

.listHeader{
  width:1580px;
  margin:12px auto 0;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;   /* 탭 아래 선 기준 정렬 */
}

.summaryWrap{
  flex:1;
  margin:0;
  padding:0;
}

.excelWrap{
  margin-left:20px;
}


</style>
</head>

<body>
<h2>속안심 Worklist</h2>

<div class="box">
  <div class="row">
    <div class="left">
      검사날짜:
      <input id="examDate" type="date">
      이름:
      <input id="name" class="short">
      차트번호:
      <input id="chart" class="short">
      <button id="btnAdd">등록</button>
    </div>

    <div class="right">
      찾기:
      <input id="q" class="search" placeholder="이름/차트/검사">
      <button id="btnSearch">검색</button>
      <button id="btnReset">초기화</button>
    </div>
  </div>

  <div class="categoryBox">
    <span class="label">분류(선택):</span>
    <label><input type="radio" name="category" value="영상"> 영상</label>
    <label><input type="radio" name="category" value="심장초음파"> 심장초음파</label>
    <label><input type="radio" name="category" value="초음파"> 초음파</label>
  </div>

  <div class="examWrap">
    <div class="examGrid">

      <div class="examGroup">
        <div class="examTitle toggle">CT</div>
        <div class="examItems">
          <label class="chk"><input class="examChk" type="checkbox" value="C-CT">C-CT</label>
          <label class="chk"><input class="examChk" type="checkbox" value="A-CT">A-CT</label>
          <label class="chk"><input class="examChk" type="checkbox" value="B-CT">B-CT</label>
          <label class="chk"><input class="examChk" type="checkbox" value="Cardiac CT">Cardiac CT</label>
          <label class="chk"><input class="examChk" type="checkbox" value="CECA CT">CECA CT</label>
          <label class="chk"><input class="examChk" type="checkbox" value="dynamic CT">dynamic CT</label>
          <label class="chk"><input class="examChk" type="checkbox" value="기타 CT">기타 CT</label>
        </div>
      </div>

      <div class="examGroup">
        <div class="examTitle toggle">MRI</div>
        <div class="examItems">
          <label class="chk"><input class="examChk" type="checkbox" value="B-MRI">B-MRI</label>
          <label class="chk"><input class="examChk" type="checkbox" value="B-MRA">B-MRA</label>
          <label class="chk"><input class="examChk" type="checkbox" value="B-MRI&MRA">B-MRI&MRA</label>
          <label class="chk"><input class="examChk" type="checkbox" value="복부MRI">복부MRI</label>
          <label class="chk"><input class="examChk" type="checkbox" value="관절MRI">관절MRI</label>
          <label class="chk"><input class="examChk" type="checkbox" value="SPINE MRI">SPINE MRI</label>
        </div>
      </div>

      <div class="examGroup">
        <div class="examTitle toggle">초음파</div>
        <div class="examItems">
          <label class="chk"><input class="examChk" type="checkbox" value="HU">HU</label>
          <label class="chk"><input class="examChk" type="checkbox" value="IU">IU</label>
          <label class="chk"><input class="examChk" type="checkbox" value="TU">TU</label>
          <label class="chk"><input class="examChk" type="checkbox" value="TTE">TTE</label>
          <label class="chk"><input class="examChk" type="checkbox" value="BU">BU</label>
        </div>
      </div>

      <div class="examGroup">
        <div class="examTitle toggle">검진</div>
        <div class="examItems">
          <label class="chk"><input class="examChk" type="checkbox" value="건강검진">건강검진</label>
          <label class="chk"><input class="examChk" type="checkbox" value="위내시경">위내시경</label>
          <label class="chk"><input class="examChk" type="checkbox" value="대장내시경">대장내시경</label>
          <label class="chk"><input class="examChk" type="checkbox" value="기타">기타</label>
        </div>
      </div>

    </div>
  </div>
</div>

<hr>

<div class="listHeader">
  <div id="summaryBox" class="summaryWrap"></div>
  <div class="excelWrap">
    <button id="btnExportXlsx">엑셀로 저장</button>
  </div>
</div>


<div class="tableWrap">
  <table id="worklistTable" border="1">
    <thead>
      <tr>
        <th>검사날짜</th>
        <th>이름</th>
        <th>차트번호</th>
        <th>검사항목</th>
        <th>분류</th>
        <th>상태</th>
        <th>접수</th>
        <th>Start</th>
        <th>Finish</th>
        <th>검사결과</th>
        <th>추적검사시기</th>
        <th>관리</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module" src="./script.js"></script>
</body>
</html>
